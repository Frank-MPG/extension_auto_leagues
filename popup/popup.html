<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Ligues de test</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
          <path d="M9 3h6M10 3v5.2L4.6 17.4A2.4 2.4 0 0 0 6.7 21h10.6a2.4 2.4 0 0 0 2.1-3.6L14 8.2V3"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M7.5 15h9" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <div class="title">Ligues de test <span class="env-badge" id="envBadge" title="dev.mpg.football → dev.api.mpg.football"
            hidden>DEV</span></div>
        <div class="sub" id="conn"><span class="dot"></span><span id="connText">Recherche de l'onglet MPG…</span></div>
      </div>
    </div>
    <div class="top-r">
      <span class="upd" data-mpg-update></span>
      <button type="button" class="icon-btn" id="aiKeyBtn" title="Logos IA : token Cloudflare" aria-label="Logos IA : token Cloudflare" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none"><circle cx="8" cy="15" r="4" stroke="currentColor" stroke-width="2"/><path d="m11 12 9-9m-3 3 3 3m-6 0 2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="keypop" id="aiKeyPop" hidden>
        <div class="keypop-h">Logos IA (Cloudflare)</div>
        <p class="keypop-s" id="aiKeyState"></p>
        <input id="aiKey" type="password" class="input" placeholder="Token API Cloudflare" autocomplete="off" spellcheck="false">
        <div class="keypop-a"><button type="button" class="link" id="aiKeyDel">Supprimer</button><button type="button" class="btn primary sm" id="aiKeySave">Enregistrer</button></div>
      </div>
    </div>
  </header>

  <nav class="seg" role="tablist">
    <button role="tab" data-tab="create">Créer</button>
    <button role="tab" data-tab="mercato">Mercato</button>
    <button role="tab" data-tab="vis">Ligues</button>
  </nav>

  <!-- ===================== CRÉER ===================== -->
  <main class="pane" id="pane-create">
    <section class="card">
      <div class="card-h">
        <h2>Nom</h2><span class="chip mono" id="namePreview">Test 02 - L1</span>
      </div>
      <div class="name-row">
        <input id="prefix" type="text" class="input" placeholder="Préfixe" aria-label="Préfixe" spellcheck="false">
        <div class="stepper" aria-label="Numéro">
          <button type="button" id="numDown" aria-label="Numéro précédent">−</button>
          <input id="num" type="number" min="1" aria-label="Numéro">
          <button type="button" id="numUp" aria-label="Numéro suivant">+</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-h">
        <h2>Championnats</h2>
        <div class="links"><button class="link" id="all">Tout</button><button class="link" id="none">Aucun</button>
        </div>
      </div>
      <div class="champs" id="champs"></div>
      <p class="hint">Clic sur un logo : ligue classique. <span class="kbd">⚡</span> : version express en plus.</p>
    </section>

    <section class="card">
      <div class="card-h">
        <h2>Joueurs invités</h2><span class="muted" id="playersCount"></span>
      </div>
      <div class="chips" id="userChips">
        <input id="userInput" class="chip-input" type="text" placeholder="Pseudo, email ou userId…" spellcheck="false"
          aria-label="Ajouter un joueur">
      </div>
    </section>

    <footer class="bar">
      <div class="summary" id="summary"></div>
      <button class="btn primary" id="go">Créer et lancer</button>
      <div class="alert" id="msg" hidden></div>
    </footer>
  </main>

  <!-- ===================== MERCATO ===================== -->
  <main class="pane" id="pane-mercato">
    <div class="search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
        <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input id="filter" type="search" placeholder="Filtrer les ligues (ex. Test 05)" spellcheck="false">
    </div>

    <div class="list-h">
      <span id="mcount">Ligues en mercato</span>
      <div class="links">
        <button class="link" id="mall">Tout</button>
        <button class="link" id="mnone">Aucune</button>
        <button class="icon-btn" id="mreload" title="Recharger" aria-label="Recharger">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
            <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
    <div class="list" id="leagues">
      <div class="empty">Chargement…</div>
    </div>

    <label class="switch-row">
      <span>
        <span class="switch-t">Inclure mon compte</span>
        <span class="switch-s">Faire aussi le mercato du compte principal</span>
      </span>
      <span class="switch"><input type="checkbox" id="includeMe"><span></span></span>
    </label>

    <footer class="bar">
      <div class="btn-row">
        <button class="btn" id="mgo" disabled title="Joue uniquement le tour en cours">Jouer 1 tour</button>
        <button class="btn primary" id="mfinish" disabled
          title="Enchaîne les tours puis clôture le mercato de chaque équipe complète">Terminer le mercato</button>
      </div>
      <div class="alert" id="mmsg" hidden></div>
    </footer>
  </main>

  <!-- ===================== LIGUES (visibilité sur Mon MPG) ===================== -->
  <main class="pane" id="pane-vis">
    <div class="search">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
        <path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input id="vfilter" type="search" placeholder="Rechercher une compétition" spellcheck="false">
    </div>
    <div class="vis-seg" id="vseg">
      <button data-v="shown">Affichées<span class="n" id="nShown"></span></button>
      <button data-v="hidden">Masquées<span class="n" id="nHidden"></span></button>
      <button data-v="all">Toutes<span class="n" id="nAll"></span></button>
    </div>
    <div class="fchips" id="vchips"></div>
    <div class="list-h">
      <span id="vcount"></span>
      <div class="links">
        <div class="menu-wrap">
          <button class="link" id="vsortBtn" aria-haspopup="menu" aria-expanded="false">Trier
            <svg viewBox="0 0 12 12" width="10" height="10" fill="none" style="vertical-align:-1px">
              <path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
          <div class="menu" id="vsortMenu" role="menu" hidden>
            <button role="menuitem" data-sort="status">Par statut <span>mercato, prépa, en cours,
                terminées</span></button>
            <button role="menuitem" data-sort="recent">Plus récentes d'abord</button>
            <button role="menuitem" data-sort="name">Nom (A → Z)</button>
            <button role="menuitem" data-sort="champ">Par championnat</button>
            <button role="menuitem" data-sort="kind">Ligues puis tournois</button>
          </div>
        </div>
        <button class="icon-btn" id="vreload" title="Recharger" aria-label="Recharger">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none">
            <path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
    <div class="list" id="vlist">
      <div class="empty">Chargement…</div>
    </div>
    <p class="hint" id="vhint"></p>
    <footer class="bar">
      <div class="btn-row">
        <button class="btn" id="vshowAll" disabled>Afficher</button>
        <button class="btn" id="vhideAll" disabled>Masquer</button>
      </div>
      <div class="savebar" id="vsave" hidden>
        <span id="vdirty"></span>
        <div class="links"><button class="link" id="vcancel">Annuler</button><button class="btn primary sm"
            id="vcommit">Enregistrer</button></div>
      </div>
      <div class="alert" id="vmsg" hidden></div>
    </footer>
  </main>

  <script src="popup.js"></script>
  <script src="../update.js"></script>
</body>

</html>
